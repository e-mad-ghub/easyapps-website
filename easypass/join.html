<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.easyapps.easypass&amp;pcampaignid=web_share">
  <title>Install easyPass</title>
  <style>
    :root { --ink: #102321; --muted: #52646a; --accent: #00bfa5; --line: #d9e9e4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--ink); background: #fbfefd; font-family: Arial, Helvetica, sans-serif; line-height: 1.6; }
    main { width: min(560px, calc(100% - 40px)); padding: 34px; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 14px 35px rgba(16, 35, 33, .08); }
    img { width: 96px; height: 96px; object-fit: contain; border-radius: 22px; }
    h1 { margin: 18px 0 8px; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -1px; }
    p { margin: 0 0 22px; color: var(--muted); }
    a.button { display: inline-block; padding: 13px 22px; border-radius: 999px; color: var(--ink); background: var(--accent); font-weight: 700; text-decoration: none; }
  </style>
  <script>
    window.location.replace("https://play.google.com/store/apps/details?id=com.easyapps.easypass&pcampaignid=web_share");
  </script>
</head>
<body>
  <main>
    <img src="easypass-logo.png?v=2" alt="easyPass logo">
    <h1>Install easyPass</h1>
    <p>Redirecting you to the easyPass listing on Google Play.</p>
    <a class="button" href="https://play.google.com/store/apps/details?id=com.easyapps.easypass&amp;pcampaignid=web_share">Open Google Play</a>
  </main>
</body>
</html>
